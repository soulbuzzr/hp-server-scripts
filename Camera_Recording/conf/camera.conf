#######################################
# Camera Identification flags
#######################################

SUBNET="192.168.1.0/24"

#######################################
# RTSP Settings (per camera)
#######################################

RTSP_PORT=554

CAMERA_RTSP_PATH="/live/ch00_0"

#######################################
# Per-Camera Video Format
#######################################

MAIN_CAMERA_FILE_EXTENSION="mp4"
MINI_CAMERA_FILE_EXTENSION="mkv"

#######################################
# Recording Settings
#######################################

SEGMENT_DURATION=120       # 2 minutes

#######################################
# Storage
#######################################

OUTPUT_DIR="/home/hpserver/Ramdisk/Camera_Recording"
ARCHIVE_DIR="/mnt/camera"

#######################################
# Upload Interval 
#######################################

POLL_INTERVAL=10       # [in seconds]

#######################################
# Camera Footage Retention Period
#######################################

ARCHIVE_RETENTION_DAYS=10

#######################################
# Ramdisk Footage Retention Period
#######################################

MAX_AGE_SECONDS=21600   # 6 hours

#######################################
# RTSP Timeout (microseconds)
#######################################

RTSP_TIMEOUT=5000000    # 5 seconds

#######################################
# Upload file size limit
#######################################

# Telegram Bot file size limit (50 MiB)
MAX_UPLOAD_SIZE=50000000

